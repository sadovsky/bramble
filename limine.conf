# Limine 9.x boot configuration. QEMU only; real hardware is out of scope.
# The limine crate we build against targets protocol revision 9, so the
# bootloader binaries must be the v9.x series.
timeout: 0
verbose: no

/Bramble
    protocol: limine
    path: boot():/boot/bramble
    # v1's userspace: loaded as boot modules, since there is no filesystem and
    # deliberately never will be one.
    module_path: boot():/boot/hello
    module_path: boot():/boot/faulter
    module_path: boot():/boot/pinger
    module_path: boot():/boot/ponger
    module_path: boot():/boot/init
    module_path: boot():/boot/worker
    module_path: boot():/boot/v1
    module_path: boot():/boot/lazy
